                const pfmsRef = `PFMS-DBT-2026-UP-${Math.floor(100000 + Math.random()*900000)}`;
                
                let targetOrder = null;
                const updatedOrders = agriOrders.map(order => {
                    if (order.id === orderId || order.permitNumber === orderId) {
                        const updated = {
                            ...order,
                            paymentStatus: 'SUCCESS',
                            paymentMethod: paymentMethod || order.paymentMethod,
                            status: order.deliveryMode === 'HOME_DELIVERY' ? 'ALLOCATED_DEPOT' : 'READY_FOR_PICKUP',
                            deliveryEta: order.deliveryMode === 'HOME_DELIVERY' ? 'Dispatched from Rampur PACS Depot' : 'Ready for Counter Collection',
                            paymentUtr: generatedUtr,
                            pfmsRef: pfmsRef,
                            paidAt: new Date().toISOString()
                        };
                        targetOrder = updated;
                        return updated;
                    }
                    return order;
                });

                if (targetOrder) {
                    const paymentRecord = {
                        id: `pay-txn-${Date.now()}`,
                        orderId: targetOrder.id,
                        permitNumber: targetOrder.permitNumber,
                        farmerName: targetOrder.farmerName,
                        transactionType: 'AGRI_INPUT_PURCHASE',
                        amount: targetOrder.totalFarmerPay,
                        govtSubsidyAmount: targetOrder.totalGovtSubsidy,
                        paymentMethod: paymentMethod || targetOrder.paymentMethod,
                        paymentStatus: 'SUCCESS',
                        utrNumber: generatedUtr,
                        gatewayTxnId: `TXN_GATEWAY_${Date.now()}`,
                        pfmsReference: pfmsRef,
                        paidAt: new Date().toISOString()
                    };

                    const updatedLedger = [paymentRecord, ...paymentLedger];
                    setPaymentLedger(updatedLedger);
                    setAgriOrders(updatedOrders);
                    broadcast(tokens, centers, updatedOrders);
                    setActivePaymentOrder(null);
                    setActiveReceiptOrder(targetOrder);

                    // Update PostgreSQL sync metrics
                    setPostgresStatus(prev => ({
                        ...prev,
                        lastSync: new Date().toLocaleTimeString(),
                        latencyMs: +(Math.random() * 0.8 + 1.2).toFixed(1)
                    }));

            const advanceOrderStatus = (orderId) => {
                const updatedOrders = agriOrders.map(order => {
                    if (order.id === orderId || order.permitNumber === orderId) {
                        let nextStatus = order.status;
                        let nextPay = order.paymentStatus;
                        let nextEta = order.deliveryEta;

                        if (order.status === 'PENDING_PAYMENT') {
                            nextStatus = 'ALLOCATED_DEPOT';
                            nextPay = 'SUCCESS';
                            nextEta = 'Packaging completed at Rampur Depot';
                        } else if (order.status === 'ALLOCATED_DEPOT') {
                            nextStatus = 'IN_TRANSIT';
                            nextEta = 'In transit (approx 4.2 km away - 18 mins)';
                        } else if (order.status === 'IN_TRANSIT') {
                            nextStatus = 'DELIVERED';
                            nextEta = 'Delivered & Verified at Farm Gate';
                        } else if (order.status === 'READY_FOR_PICKUP') {
                            nextStatus = 'DELIVERED';
                            nextPay = 'SUCCESS';
                            nextEta = 'Collected by Farmer at Depot Counter';
                        }
                        return {
                            ...order,
                            status: nextStatus,
                            paymentStatus: nextPay,
                            deliveryEta: nextEta

                    return order;
                });
                setAgriOrders(updatedOrders);
                broadcast(tokens, centers, updatedOrders);

            const syncPostgreSQL = async () => {
                setPostgresStatus(prev => ({ ...prev, syncing: true }));

                    if (res && res.ok) {

                        setPostgresStatus(prev => ({
                            ...prev,
                            syncing: false,
                            status: 'CONNECTED',
                            lastSync: new Date().toLocaleTimeString(),
                            latencyMs: data.latencyMs || 1.8
                        }));
                    } else {

                                status: 'CONNECTED',
                                lastSync: new Date().toLocaleTimeString(),
                                latencyMs: +(Math.random() * 0.6 + 1.4).toFixed(1)

                        completed = obj;
                        return obj;
                    }
                    return t;

                setTokens(up);

                return completed;

                }

                                    <button

                    {/* Previous Agri Orders List */}

                                    <div key={order.id} className="bg-slate-50 border border-slate-300 rounded p-3 space-y-2">

                                                <span className="font-mono font-bold text-[#137547]">₹{order.totalFarmerPay.toFixed(2)}</span>

                                                💬 {language === 'hi' ? 'व्हाट्सएप परमिट' : 'WhatsApp Permit'}

        // --- MODULE C: MANDI TERMINAL ---
        const MandiTerminalModule = () => {
            const { tokens, checkInToken, updateMoisture, callToWeighbridge, completeWeighment, setActivePassToken, setActiveWhatsAppModal, currentCenter, language } = usePortalContext();
            const [scanInput, setScanInput] = useState('');
            const [selectedToken, setSelectedToken] = useState(null);
            const [moist, setMoist] = useState('14.2');
            const [gross, setGross] = useState('125.0');
            const [tare, setTare] = useState('45.0');
            const [filter, setFilter] = useState('ALL');

            const handleScan = (e) => {
                e.preventDefault();
                const found = tokens.find(t => t.tokenNumber.toUpperCase() === scanInput.trim().toUpperCase() || t.vehicleRegistration.replace(/\s/g, '').toUpperCase() === scanInput.trim().replace(/\s/g, '').toUpperCase() || t.tokenNumber.toUpperCase().includes(scanInput.trim().toUpperCase()));
                if (found) {
                    checkInToken(found.tokenNumber);
                    setSelectedToken(found);
                    setScanInput('');
                } else {
                    alert('No token found matching ' + scanInput);
                }
            };

            const handleMoistSubmit = (e) => {
                e.preventDefault();
                if (selectedToken) updateMoisture(selectedToken.tokenNumber, moist);
            };

            const handleWeighSubmit = (e) => {
                e.preventDefault();
                if (selectedToken) {
                    const comp = completeWeighment(selectedToken.tokenNumber, gross, tare);
                    if (comp) setActiveWhatsAppModal({ data: comp, eventType: 'WEIGHMENT_COMPLETE' });
                }
            };

            const filtered = tokens.filter(t => filter === 'ALL' || t.status === filter);
            const netCalc = Math.max(0, (parseFloat(gross) || 0) - (parseFloat(tare) || 0));
            const payCalc = Math.round(netCalc * (selectedToken ? selectedToken.mspRate : 2300));

            return (
                <div className="max-w-7xl mx-auto px-4 py-5 space-y-4">

                        <div>
                            <span className="text-[10px] font-bold text-[#0B2545] uppercase">Intranet Terminal: NIC-PPC-TER-04</span>
                            <h2 className="text-lg font-bold text-slate-900">{language === 'hi' ? currentCenter.nameHindi : currentCenter.name}</h2>
                            <div className="text-xs text-slate-600">PPC Code: <strong className="font-mono">{currentCenter.code}</strong></div>
                        </div>
                        <div className="flex gap-2 text-xs">
                            <div className="bg-slate-50 border px-3 py-1 rounded text-center">Yard: <strong className="text-blue-900 font-mono">{tokens.filter(t => t.status === 'WAITING_IN_YARD').length}</strong></div>

                            <div className="bg-slate-50 border px-3 py-1 rounded text-center">Completed: <strong className="text-emerald-800 font-mono">{tokens.filter(t => t.status === 'COMPLETED').length}</strong></div>
                        </div>
                    </div>

                    {/* Gate Scan */}
                    <div className="bg-[#0B2545] text-white p-4 rounded shadow-sm">
                        <form onSubmit={handleScan} className="flex flex-col md:flex-row gap-2.5 items-center justify-between">

                                <h3 className="font-bold text-sm">Gate Inward Registration Desk</h3>
                                <p className="text-xs text-slate-300">Scan Pass Barcode or Input Token ID (e.g. KS/UP-RAM/2026/0105)...</p>
                            </div>
                            <div className="flex gap-2 w-full md:w-auto">
                                <input
                                    value={scanInput}
                                    onChange={e => setScanInput(e.target.value)}

                                />
                                <button type="submit" className="px-4 py-1.5 bg-[#137547] hover:bg-[#0D4F30] text-white font-bold text-xs rounded">
                                    Check-In
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* Desks */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        {/* QC Moisture */}

                            {selectedToken ? (
                                <form onSubmit={handleMoistSubmit} className="space-y-2 text-xs">
                                    <div className="bg-slate-50 p-2 rounded border flex justify-between">
                                        <span>{selectedToken.farmerName} ({selectedToken.tokenNumber})</span>
                                        <strong className="text-[#137547]">{selectedToken.commodity}</strong>
                                    </div>
                                    <div className="flex gap-2">
                                        <input type="number" step="0.1" value={moist} onChange={e => setMoist(e.target.value)} className="p-1.5 border rounded font-mono font-bold flex-1" />
                                        <button type="submit" className="px-3.5 py-1.5 bg-[#0B2545] text-white font-bold rounded">Log Reading</button>
                                    </div>
                                    <div className={`p-2 rounded font-bold flex justify-between ${parseFloat(moist) <= 17 ? 'bg-emerald-100 text-emerald-900 border border-emerald-300' : 'bg-red-100 text-red-900 border border-red-300'}`}>
                                        <span>{parseFloat(moist) <= 17 ? '✓ AGMARK GRADE-I PASSED' : '⚠ HIGH MOISTURE DEFECT (>17%)'}</span>
                                        <span>{moist}%</span>
                                    </div>
                                </form>
                            ) : <div className="py-6 text-center text-xs text-slate-400">Select a token below to record digital moisture reading.</div>}
                        </div>

                        {/* Weighbridge */}
                        <div className="bg-white rounded p-4 border border-slate-300 shadow-sm space-y-3">
                            <h3 className="text-xs font-bold text-slate-900 uppercase border-b pb-1">Certified Electronic Weighbridge Terminal</h3>
                            {selectedToken ? (
                                <form onSubmit={handleWeighSubmit} className="space-y-2 text-xs">
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-slate-600 font-bold block mb-1">Gross Wt (Loaded, qtl)</label>
                                            <input type="number" step="0.01" value={gross} onChange={e => setGross(e.target.value)} className="w-full p-1.5 border rounded font-mono font-bold" />
                                        </div>
                                        <div>
                                            <label className="text-slate-600 font-bold block mb-1">Tare Wt (Empty, qtl)</label>
                                            <input type="number" step="0.01" value={tare} onChange={e => setTare(e.target.value)} className="w-full p-1.5 border rounded font-mono font-bold" />
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 border border-slate-300 p-2 rounded flex justify-between font-bold">
                                        <span>Net Wt: <strong className="text-slate-900 font-mono">{netCalc.toFixed(2)} qtl</strong></span>
                                        <span>MSP DBT Payout: <strong className="text-[#137547] font-mono">₹{payCalc.toLocaleString('en-IN')}</strong></span>
                                    </div>
                                    <button type="submit" className="w-full py-2 bg-[#137547] text-white font-bold rounded shadow uppercase">

                        </div>
                    </div>

                    {/* Master Table */}

                                    </tr>

                                    {filtered.map(t => (
                                        <tr key={t.id} className="hover:bg-slate-50">
                                            <td className="p-2 font-mono font-bold text-[#0B2545]">{t.tokenNumber}</td>
                                            <td className="p-2 font-bold text-slate-900">{t.farmerName}</td>

                                                <button onClick={() => setActivePassToken(t)} className="px-2 py-1 bg-slate-100 text-slate-600 rounded text-[10px]">Pass</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

        // --- MODULE D: YARD DISPLAY BOARD ---
        const YardDisplayBoardModule = () => {
            const { currentCenter, tokens, language } = usePortalContext();
            const [time, setTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const centerTokens = tokens.filter(t => t.centerId === currentCenter.id || t.centerName === currentCenter.name);
            const serving = centerTokens.find(t => t.status === 'AT_WEIGHBRIDGE');
            const yardQueue = centerTokens.filter(t => t.status === 'WAITING_IN_YARD');
            const nextInLine = yardQueue.slice(0, 4);
            const completed = centerTokens.filter(t => t.status === 'COMPLETED');
            const completedQtl = completed.reduce((sum, t) => sum + (t.netWeightQtl || t.estimatedQuantityQtl || 0), 0);

            const waitMins = Math.round((yardQueue.length / (currentCenter.hourlyThroughput || 15)) * 60);
            const isCongested = waitMins >= 90 || yardQueue.length >= 22;

            return (
                <div className="bg-slate-950 text-white min-h-[85vh] p-5 space-y-5">

                                <span className="text-[10px] font-black text-red-500 uppercase tracking-widest animate-pulse">● PUBLIC YARD DISPLAY BOARD</span>

                                {time.toLocaleTimeString()} IST
                            </div>
                        </div>

                            <div className="bg-amber-600 text-white p-4 rounded font-bold flex justify-between items-center">
                                <div>
                                    <div className="text-xs uppercase text-amber-200">High Congestion Alert (Wait: ~{waitMins} min)</div>
                                    <div className="text-sm">Suggesting Diversion to Mandi Kalyanpur (11 km away, Zero Wait Time)</div>
                                </div>
                                <span className="bg-slate-950 px-3 py-1 rounded text-amber-300 text-xs font-mono">Route: NH-24</span>
                            </div>
                        )}

                        {/* Metrics */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div className="bg-slate-900 p-4 rounded border border-slate-800">
                                <span className="text-[10px] uppercase font-bold text-slate-400">Estimated Yard Wait Time</span>
                                <div className="text-2xl font-black font-mono text-emerald-400 mt-1">~{waitMins} <span className="text-xs text-slate-400">Minutes</span></div>
                                <div className="text-[10px] text-slate-500 font-mono mt-0.5">({yardQueue.length} in yard / {currentCenter.hourlyThroughput} throughput/hr)</div>
                            </div>
                            <div className="bg-slate-900 p-4 rounded border border-slate-800">
                                <span className="text-[10px] uppercase font-bold text-slate-400">Vehicles in Holding Yard</span>
                                <div className="text-2xl font-black font-mono text-blue-400 mt-1">{yardQueue.length}</div>
                            </div>
                            <div className="bg-slate-900 p-4 rounded border border-slate-800">
                                <span className="text-[10px] uppercase font-bold text-slate-400">Procurement Progress</span>
                                <div className="text-2xl font-black font-mono text-amber-400 mt-1">{completedQtl.toFixed(1)} <span className="text-xs text-slate-400">/ {currentCenter.dailyTargetQtl} qtl</span></div>
                            </div>
                        </div>

                        {/* Display Split */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                            {/* NOW SERVING */}
                            <div className="lg:col-span-7 bg-slate-900 p-5 rounded border-2 border-emerald-500">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <span className="text-xs font-black text-emerald-400 uppercase tracking-wider animate-pulse">NOW SERVING AT WEIGHBRIDGE #01</span>
                                    <span className="text-[10px] bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded font-mono">SCALES ACTIVE</span>
                                </div>

                                {serving ? (
                                    <div className="py-4 space-y-3">
                                        <div className="text-4xl font-mono font-black text-white">{serving.tokenNumber}</div>
                                        <div className="bg-slate-950 p-3 rounded border border-slate-800 flex justify-between items-center">
                                            <div>
                                                <div className="text-[9px] text-slate-400 uppercase font-bold">Farmer Name</div>
                                                <strong className="text-base text-white">{serving.farmerName}</strong>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-[9px] text-slate-400 uppercase font-bold">Vehicle Reg.</div>
                                                <div className="text-lg font-mono font-black text-gov-saffron">{serving.vehicleRegistration}</div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="py-12 text-center text-slate-500 font-bold">Weighbridge Desk Ready. Calling next vehicle...</div>
                                )}
                            </div>

                            {/* NEXT IN LINE */}
                            <div className="lg:col-span-5 bg-slate-900 p-5 rounded border border-slate-800">
                                <div className="border-b border-slate-800 pb-2 font-bold text-xs uppercase text-slate-300">
